# DRAFT ONLY — DO NOT COPY TO PRODUCTION UNTIL DNS/TLS AND PORTAL ENDPOINTS ARE READY.
# ERP employee runtime perimeter.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.urisacompresores.com;

    # TLS paths are added by Certbot after DNS resolves.
    # ssl_certificate ...
    # ssl_certificate_key ...

    client_max_body_size 50M;

    # ERP auth endpoints are served by the existing portal Next.js process.
    location ^~ /urisa-auth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control "private, no-store" always;
    }

    # Internal auth subrequest. Never exposed as an Appsmith route.
    location = /urisa_auth_check {
        internal;
        proxy_pass http://127.0.0.1:3001/urisa-auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime remains CLOSED until auth flow is certified.
    # Replace 'return 403;' with the protected proxy block only after PASS.
    location / {
        return 403;

        # FUTURE, AFTER CERTIFICATION:
        # auth_request /urisa_auth_check;
        #
        # error_page 401 = @erp_login;
        # error_page 403 = @erp_denied;
        #
        # proxy_pass http://127.0.0.1:8080;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        #
        # IMPORTANT:
        # Do not forward the URISA ERP session cookie to Appsmith.
        # Cookie filtering must be implemented/tested before enabling this block.
    }

    location @erp_login {
        return 302 https://portal.urisacompresores.com/login;
    }

    location @erp_denied {
        return 403;
    }
}

# HTTP server used only for ACME and HTTPS redirect after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name erp.urisacompresores.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 403;
        # Change to HTTPS redirect only after certificate is valid.
        # return 301 https://$host$request_uri;
    }
}
